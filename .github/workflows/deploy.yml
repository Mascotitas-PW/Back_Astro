name: Back CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: dotnet restore back.csproj
    #  - run: dotnet format whitespace back.csproj --verify-no-changes
      - run: dotnet build back.csproj -c Release --no-restore
     # - run: dotnet test Tests/Tests.csproj -c Release       # Ajusta o comenta si aún no tienes proyecto de pruebas
      - run: dotnet publish back.csproj -c Release -o publish --no-build
      - uses: actions/upload-artifact@v4
        with: { name: back-publish, path: publish }
